<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Drill Suite</title>
    <link rel="stylesheet" href="core/styles.css" />
    <style>
      .menu-container {
        max-width: 700px;
        width: 100%;
        background: #1e3a2a;
        border-radius: 48px;
        padding: 30px;
        text-align: center;
      }
      .menu-title {
        color: #f7e05e;
        font-size: 1.8rem;
        margin-bottom: 30px;
      }
      .drill-card {
        background: #0f2a1c;
        border-radius: 28px;
        padding: 20px;
        margin-bottom: 20px;
        text-align: left;
        border: 1px solid #c4a66a;
      }
      .drill-title {
        color: #ffd966;
        font-size: 1.3rem;
        margin-bottom: 8px;
      }
      .drill-desc {
        color: #c0b07a;
        font-size: 0.85rem;
        margin-bottom: 16px;
      }
      .drill-btn {
        background: #4c8b5e;
        border: none;
        padding: 10px 24px;
        border-radius: 40px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .drill-btn:active {
        transform: translateY(2px);
      }
    </style>
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-title">🎴 POKER DRILL SUITE</div>

      <div class="drill-card">
        <div class="drill-title">1️⃣ OUTS TRAINER</div>
        <div class="drill-desc">
          Count flush, straight, and overcard outs from any flop.
        </div>
        <a href="outs-trainer/index.html" class="drill-btn">START →</a>
      </div>

      <div class="drill-card">
        <div class="drill-title">2️⃣ POT ODDS TRAINER</div>
        <div class="drill-desc">
          Calculate required equity % from pot size and bet.
        </div>
        <a href="pot-odds-trainer/index.html" class="drill-btn">START →</a>
      </div>

      <div class="drill-card">
    <div class="drill-title">3️⃣ PREFLOP RANGE TRAINER</div>
    <div class="drill-desc">Learn which hands to play from each position (RFI). Single position or mixed mode.</div>
    <a href="preflop-trainer/index.html" class="drill-btn">START →</a>
      </div>
    </div>
  </body>
</html>
